[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autharis-matching"
version = "0.1.0"
description = "Autharis matching microservice — FastAPI + scikit-learn scoring engine (Lane F7)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Autharis swarm", email = "swarm@autharis.local" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "scikit-learn>=1.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autharis_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
