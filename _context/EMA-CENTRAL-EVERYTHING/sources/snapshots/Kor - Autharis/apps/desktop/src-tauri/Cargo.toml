[package]
name = "autharis_desktop"
version = "0.1.0"
description = "Autharis admin desktop (Tauri 2 shell). Lane G6."
authors = ["Autharis"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "autharis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by Tauri for macOS "custom-protocol" runtime.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
