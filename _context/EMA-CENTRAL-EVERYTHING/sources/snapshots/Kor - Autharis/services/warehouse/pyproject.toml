[project]
name = "autharis-warehouse"
version = "0.1.0"
description = "Autharis analytics pipeline — dbt + DuckDB. Lane G7."
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.8",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
