<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Stylized eye/claw mark in OpenClaw accent color -->
  <circle cx="16" cy="16" r="14" fill="#0A0A0A" stroke="#E8A838" stroke-width="1.5"/>
  <!-- Eye shape -->
  <path d="M6 16 Q16 6 26 16 Q16 26 6 16 Z" fill="none" stroke="#E8A838" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Iris -->
  <circle cx="16" cy="16" r="4" fill="#E8A838"/>
  <!-- Pupil -->
  <circle cx="16" cy="16" r="1.5" fill="#0A0A0A"/>
  <!-- Claw marks (three subtle scratches) -->
  <line x1="22" y1="7" x2="24" y2="11" stroke="#E8A838" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="24" y1="6" x2="26" y2="10" stroke="#E8A838" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="26" y1="5" x2="28" y2="9" stroke="#E8A838" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
</svg>
